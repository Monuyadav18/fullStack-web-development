<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color & Background</title>
</head>
<style>

    #Hello{
        color: gold;
        background-color: #aa42ff;

    }
    #background{
        color: red; background-color: black;
    }
    #Transparency{
        color: rgba(100, 150, 205, 0.8);
        background-color: red;
    }
    #box1{
        background-color: yellow;
        height: 50px;
        width: 50px;
    }
    #box2{
        background-color: green;
        height: 50px;
        width: 50px;
    }
    #box3{
        background-color: blue;
        color: gold;
        height: 50px;
        width: 50px;
    }
    #icon{
        height: 30px;
        width: 50px;
        background-image:url(Myntra-Logo.png);
        background-size: 50px;
        background-repeat: no-repeat;
    }
    .box{
        height: 50px;
        width: 50px;
    }
    #box4{
        background-color: yellowgreen;
        visibility: hidden;
    }
    #box5{
        background-color: firebrick;
        visibility: visible;
    }
</style>
<body>
    <div id="background">Background Color</div>
    <hr>

    <div id="Hello">Hello</div>
    <hr>

    <div id="Transparency">Transparency</div>
    <hr>

    <div id="box1">Box 1</div>
    <hr>

    <div id="box2">Box 2</div>
    <hr>

    <div id="box3">Box 3</div>
    <hr>

    <div id="icon"></div>
    <hr>

    <div id="box4" class="box">Box 4</div>
    <hr>

    <div id="box5" class="box">Box 5</div>
</body>
</html>
