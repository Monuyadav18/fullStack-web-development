<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo & Transition</title>
</head>
<style>
.click {
    height: 25px;
    width: 80px;
    margin: 10px;
    background-color: grey;
    border: 2px solid;
    border-radius: 10px;
    transition: all 2s ease-in-out 0s;
}
.click:hover {
    background-color: red;
    height: 30px;
    width: 100px;
}
.click:active {
    background-color: blue;
    height: 30px;
    width: 90px;
}
</style>
<body>
    <button class="click">
        Click 👈
    </button>
</body>
</html>
