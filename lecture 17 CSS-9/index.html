<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS Transform</title>
</head>
<style>
    .image {
        border: 3px solid;
        margin-left: 20px;
        border-radius: 30px;
        margin: 50px;
        transform: rotate(300deg);
    }
    .image:hover {transform: scale(2);}
    .box {
        height: 200px;
        width: 300px;
        margin: 50px;
        text-align: center;
        border: 5px solid;
        background-color: blueviolet;
        transform: rotate(30deg);
    }
    .box:hover {transform: scale(0.8);}
</style>
<body>
    <h3>Image</h3>
    <img class="image" src="download.jpg" alt="Lizard"><br><br>

    <div class="box">Transform</div>
</body>
</html>
