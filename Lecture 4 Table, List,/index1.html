<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h2>Web Designing</h2>
    <ol>
        <li>HTML</li>
        <li>CSS</li>
        <li>JS</li>
    </ol>

    <h2>Web Devlopment</h2>
    <ol>
        <li>Frontend</li>
        <ol type="a">
            <li>HTML</li>
            <li>CSS</li>
            <li>JS</li>
        </ol>
        <li>Backend</li>
        <ul style="list-style-type:square;">
            <li>REACT</li>
            <li>NODE JS</li>
            <li>MONGO DB</li>
            <li>SQL</li>
        </ul>
    </ol>
</body>
</html>
