<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>
       <fieldset>
        <legend>Registration form</legend>
        <label for="Name ">Full Name</label>
        <input type="text" id="Full Name" placeholder="enter your name here!">
        <br>
        <br>
        <label for="datepicker">D.O.B:-</label>
        <input type="date" id="datepicker">
        <br>
        <br>
        <label for="select 1">Gender:-</label>
        <select name="Gender" id="select 1">
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Transgender">Transgender</option>
            
        </select>
            <br>
            <br>
        <label for="select 1">Occupation:-</label>
        <select name="Occupation" id="select 1">
            <option value="Student">Student</option>
            <option value="Job">Job</option>
            <option value="Unemployment">Unemployment</option>
        </select>
        <br>
        <br>
        <label for="">Maritial Status :- </label>
        <label for="radio1">Married</label>
        <input type="radio" name="radio1" id="radio1">
        
        <label for="radio2">Unmarried</label>
        <input type="radio" name="radio1" id="radio2">
        <br>
        <br>
        <label for="">Prefer Language :-</label>
        <label for="checkbox1">English</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        
        <label for="checkbox1">Hindi</label>
        <input type="checkbox" name="checkbox1" id="checkbox1">
        <br>
        <br>

        <label for="fileselect1">upload photo :-</label>
        <input type="file" name="fileselect1" id="fileselect1">
        <br>
        <br>

        <input type="image" name="photo" id="photo" alt="click here" src="QR_code_for_mobile_English_Wikipedia.svg" height="100px" width="100px">
        <br>
        <br>


        <input type="submit" value="submit">
        <br>
        <br>

        <textarea name="textarea1" id="textarea1" cols="30" rows="10" placeholder="comment here!!!!"></textarea>
        <br>
        <br>
       </fieldset>
    </form>
</body>
</html>
