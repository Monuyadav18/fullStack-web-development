<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <style>
        @media screen and (min-width:600px) { 
            .box {
                background-color: cadetblue;
            }
        }
        .box {
            height: 100px;
            width: 100px;
            padding: 10px;
            background-color: violet;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
