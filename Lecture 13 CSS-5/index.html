<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--- block Element -->
    <div class="box" id="box1">Box 1</div>
    <div class="box" id="box2">Box 2</div> <br>

    <!--- inline Element -->
    <div class="book" id="box3">BOX 3</div>
    <div class="book" id="box4">Box 4</div>

    <!--Relative units: Percentage-->
    <div id="firstdiv">
        First Div
        <div id="seconddiv">
            Second Div
        </div>
    </div>
    <br>

    <!--Relative units: em-->
    <div id="thirddiv">
        Third Div
    <div id="fourthdiv">
        Fourth Div
    </div></div>
    <br>

    <div id="sixdiv">
        Six Div
    </div>
    <br>
    
    <div class="div">
    <div id="container1">Static</div>
    <div id="container2">Relative</div>
    <div id="container3">Absolute</div>
    <div id="container4">Fixed</div>
    </div>

</body>
</html>
