<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
</head>
<style>
    #div {
        height: 200px;
        width: 200px;
        background-color: firebrick;
        padding: 10px;
        margin: 20px;
        border: 5px solid;
        border-radius: 10px 20px 30px 40px;
        box-sizing: content-box;
        }

        #button {
            height: 70px;
            width: 70px;
            padding: 10px 15px;
            margin: 100px;
            border: 2px dotted red;
            border-radius: 35px;
        }
        .box {
            height: 100px;
            width: 100px;
            padding: 5px;
            margin: 5px;
            background-color: hotpink;
        }
</style>
<body>
    <div id="div">Click here..</div>
    <hr>

    <button id="button">Click me</button>
    <hr>

    <div style="box-sizing: border-box;" class="box">Box1</div>
    <div style="box-sizing: content-box;" class="box">Box2</div>
</body>
</html>
