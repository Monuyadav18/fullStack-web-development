<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box, Grid & Media Queries</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div id="container">
        <div id="box1" class="box">Box 1</div>
        <div id="box2" class="box">Box 2</div>
    </div>

    <h2 id="heading">Flex Box</h2>
    <div id="container1">
        <div id="div1" class="div">Div 1</div>
        <div id="div2" class="div">Div 2</div>
        <div id="div3" class="div">Div 3</div>
        <div id="div4" class="div">Div 4</div>
    </div><br>

    <div id="container2">
        <div id="flex1" class="flex">Flex Item 1</div>
        <div id="flex2" class="flex">Flex Item 2</div>
        <div id="flex3" class="flex">Flex Item 3</div>
    </div>

    <div id="container3">
        <div id="flex4" class="grid">Flex Item 4</div>
        <div id="flex5" class="grid">Flex Item 5</div>
        <div id="flex6" class="grid">Flex Item 6</div>
        <div id="flex7" class="grid">Flex Item 7</div>
    </div>
</body>
</html>
