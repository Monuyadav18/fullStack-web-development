<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
</head>
<style>
    .box {
        height: 80px;
        width: 100px;
        border: 2px solid;
        border-radius: 10px;
        text-align: center;
        background-color: brown;
        position: relative;
        top: 20px;
        left: 50px;

        animation-name: walk;
        animation-duration: 2s;
        animation-timing-function: ease-in-out;
        animation-delay: 1s;

        animation-iteration-count: infinite;
        animation-direction: alternate;

        /* Also use-- animation: walk 2s ease-in-out 1s infinite alternative; */
    }
    @keyframes walk {
        from {left: 10px;}
        to {left: 1000px;}
    }

    .logo {
        height: 80px;
        width: 80px;
        margin: 50px;
        border: 2px solid;
        background-color: green;
        border-radius: 20px;
        text-align: center;

       /* animation: logo1 2s ease-in 0s infinite alternate; */

        animation-name: logo;
        animation-duration: 3s;
        animation-timing-function: ease-in-out;
        animation-delay: 0s;

        animation-iteration-count: infinite;
        animation-direction: alternate;

    }
    @keyframes logo1 {
        from {left: 10px;}
        to {left: 300px;}
    }
</style>
<body>
    <div class="box"> <b> Animation </b> </div>

    <div class="logo">Google</div>
</body>
</html>
